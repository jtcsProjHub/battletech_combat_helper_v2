name: map_extractor_prototype
description: Standalone prototype that turns photos or scans of BattleTech map sheets into hex terrain data.
publish_to: none
version: 0.1.0

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.3
  file_selector: ^1.0.3
  image: ^4.3.0
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/
